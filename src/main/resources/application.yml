spring:
  application:
    name: ai-immigration-document-analyzer

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ==========================================================================
  # FILE UPLOAD / MULTIPART
  # ==========================================================================

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB

  # ==========================================================================
  # DATABASE
  # ==========================================================================

  datasource:
    url: ${ORACLE_DATABASE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      pool-name: ImmigrationHikariPool

      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}

      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}

      idle-timeout: ${DB_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

      connection-test-query: SELECT 1 FROM DUAL

      auto-commit: false
      register-mbeans: true

      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: ${ORACLE_CONNECT_TIMEOUT:10000}
        oracle.jdbc.ReadTimeout: ${ORACLE_READ_TIMEOUT:30000}

  # ==========================================================================
  # JPA / HIBERNATE
  # ==========================================================================

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false

        jdbc:
          time_zone: UTC
          batch_size: 50
          batch_versioned_data: true

        order_inserts: true
        order_updates: true

  # ==========================================================================
  # FLYWAY DATABASE MIGRATIONS
  # ==========================================================================

  flyway:
    enabled: true

    baseline-on-migrate: true
    validate-on-migrate: true

    # V2 already exists physically in the database but is intentionally
    # recorded as ignored because V3 was previously applied.
    #
    # This prevents application startup from failing validation with:
    # "Detected resolved migration not applied to database: 2."
    #
    # Do NOT enable out-of-order migration for this situation.
    ignore-migration-patterns: "*:ignored"

    # Leave false normally. Only enable temporarily when deliberately
    # applying a lower-numbered migration after a higher-numbered migration
    # has already been applied.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

    # Never allow Flyway clean in this application.
    clean-disabled: true

    locations: classpath:db/migration

  # ==========================================================================
  # OPENAI / AI
  # ==========================================================================

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        options:
          model: gpt-4.1-mini

      embedding:
        options:
          model: text-embedding-3-small

  # ==========================================================================
  # EMAIL
  # ==========================================================================

  mail:
    host: smtp.gmail.com
    port: 587

    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

        debug: false


# ============================================================================
# APPLICATION
# ============================================================================

app:
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

  # Public URL of the frontend application, used to build links sent in
  # emails (e.g. password reset links). Must not have a trailing slash.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}


# ============================================================================
# SERVER
# ============================================================================

server:
  port: ${PORT:${SERVER_PORT:8080}}

  shutdown: graceful

  compression:
    enabled: true

    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
      - text/css
      - application/javascript


# ============================================================================
# ACTUATOR
# ============================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized


# ============================================================================
# DOCUMENT CONFIGURATION
# ============================================================================

file:
  # Maximum raw multipart file size enforced by the storage layer.
  #
  # Allowed extensions and MIME types are validated separately by
  # DocumentService.
  max-size: ${DOCUMENT_MAX_FILE_SIZE:10485760}


# ============================================================================
# OCR
# ============================================================================

ocr:
  tessdata-path: ${TESSDATA_PATH:}
  language: ${OCR_LANGUAGE:eng}


# ============================================================================
# AWS
# ============================================================================

aws:
  region: ${AWS_REGION:eu-north-1}

  s3:
    bucket-name: ${AWS_S3_BUCKET}


# ============================================================================
# JWT SECURITY
# ============================================================================

security:
  jwt:
    secret: ${JWT_SECRET}

    # 1 hour by default
    expiration: ${JWT_EXPIRATION:3600000}


# ============================================================================
# LOGGING
# ============================================================================

logging:
  level:
    root: INFO

    org.springframework: WARN
    org.springframework.security: INFO

    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

    com.godfrey.ai_immigration_document_analyzer: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"