spring:
  # ==========================================================================
  # DATABASE / HIKARI DEVELOPMENT OVERRIDES
  # ==========================================================================

  datasource:
    hikari:
      pool-name: ImmigrationHikariPoolDev

      maximum-pool-size: 10
      minimum-idle: 2

      connection-timeout: 20000
      validation-timeout: 5000

      idle-timeout: 30000
      max-lifetime: 1800000

      # Detect connections that are held for too long during development.
      leak-detection-threshold: 20000

      connection-test-query: SELECT 1 FROM DUAL

      auto-commit: false

  # ==========================================================================
  # JPA / HIBERNATE DEVELOPMENT
  # ==========================================================================

  jpa:
    show-sql: true

    properties:
      hibernate:
        format_sql: true

        jdbc:
          batch_size: 25
          batch_versioned_data: true

        order_inserts: true
        order_updates: true

  # ==========================================================================
  # FLYWAY DEVELOPMENT
  # ==========================================================================

  flyway:
    enabled: true

    baseline-on-migrate: true
    validate-on-migrate: true

    # V2 already exists physically in the current database but is recorded
    # as ignored because V3 was previously applied.
    #
    # This allows the application to start without Flyway attempting to
    # execute V2 again.
    ignore-migration-patterns: "*:ignored"

    # Keep false by default. Do not enable this just to resolve the current
    # V2/V3 migration ordering because V2 objects already exist in the DB.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

    # Never allow Flyway clean.
    clean-disabled: true

    locations: classpath:db/migration

  # ==========================================================================
  # FILE UPLOAD DEVELOPMENT OVERRIDES
  # ==========================================================================

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2KB


# ============================================================================
# AWS DEVELOPMENT
# ============================================================================

aws:
  region: ${AWS_REGION:eu-north-1}

  s3:
    bucket-name: ${AWS_S3_BUCKET:mukondogtech-immigration-documents}


# ============================================================================
# APPLICATION
# ============================================================================

application:
  name: ai-immigration-document-analyzer


# ============================================================================
# DOCUMENT
# ============================================================================

file:
  max-size: ${DOCUMENT_MAX_FILE_SIZE:10485760}


# ============================================================================
# OCR
# ============================================================================

ocr:
  tessdata-path: ${TESSDATA_PATH:}

  language: ${OCR_LANGUAGE:eng}


# ============================================================================
# LOGGING
# ============================================================================

logging:
  level:
    root: INFO

    # Application debugging
    com.godfrey.ai_immigration_document_analyzer: DEBUG

    # Hibernate SQL debugging
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    # Security debugging
    org.springframework.security: DEBUG

    # Web request debugging
    org.springframework.web: INFO

    # Connection-pool logging
    com.zaxxer.hikari: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"